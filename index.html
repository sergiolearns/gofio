<style>
/* Lo primero que se pinta: fondo basalto (nada de pantalla gris) y la cortinilla de entrada. */
html,body{background:#1B1917;margin:0}
#cortinilla{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1B1917}
#cortinilla .c-disco{width:min(62vw,280px);height:min(62vw,280px);animation:c-gira 1.15s cubic-bezier(.16,1,.3,1) both}
#cortinilla .c-logo{width:min(46vw,200px);height:auto;margin-top:30px;animation:c-sube .7s .5s cubic-bezier(.22,1,.36,1) both}
#cortinilla .c-sub{margin:14px 0 0;color:#A89D8F;font:600 15px/1 "Hanken Grotesk",system-ui,-apple-system,sans-serif;letter-spacing:.04em;animation:c-sube .7s .7s cubic-bezier(.22,1,.36,1) both}
@keyframes c-gira{from{transform:rotate(-220deg) scale(.55);opacity:0}to{transform:none;opacity:1}}
@keyframes c-sube{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#cortinilla *{animation:none!important}}
</style>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="cortinilla" aria-hidden="true">
  <img class="c-disco" src="iconos/disco-millo.svg" alt="" width="280" height="280">
  <img class="c-logo" src="iconos/gofio-logo-oscuro.svg" alt="" width="200" height="82">
  <p class="c-sub">Hecho en Canarias</p>
</div>
<div id="app" aria-live="polite"></div>
<nav id="pestanas" class="pestanas" aria-label="Secciones" hidden></nav>
<div id="capa-hojas"></div>
<div id="aviso" class="aviso" role="status" hidden></div>
<noscript><p style="padding:24px">Gofio necesita JavaScript para funcionar.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
