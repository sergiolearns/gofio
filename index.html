<style>
/* Lo primero que se pinta (G58): el icono de la app abierto a pantalla completa, millo con la muela negra, igual que la
   imagen de arranque de iOS. Al estar lista, el ojo de la muela se abre y deja ver la app (sin repetir la portada). */
html,body{background:#1B1917;margin:0}
#cortinilla{--d:min(64vw,280px);position:fixed;inset:0;z-index:100;background:#E3A62B}
#cortinilla .c-disco{position:absolute;left:calc(50% - var(--d)/2);top:calc(50% - var(--d)/2);width:var(--d);height:var(--d)}
#cortinilla .c-sub{position:absolute;left:0;right:0;top:calc(50% + var(--d)/2 + 30px);margin:0;text-align:center;color:#1B1917;font:700 15px/1 "Hanken Grotesk",system-ui,-apple-system,sans-serif;letter-spacing:.06em}
</style>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="cortinilla" aria-hidden="true">
  <img class="c-disco" src="iconos/disco-negro-solo-gofio.svg" alt="" width="280" height="280">
  <p class="c-sub">Hecho en Canarias</p>
</div>
<div id="app" aria-live="polite"></div>
<nav id="pestanas" class="pestanas" aria-label="Secciones" hidden></nav>
<div id="capa-hojas"></div>
<div id="aviso" class="aviso" role="status" hidden></div>
<noscript><p style="padding:24px">Gofio necesita JavaScript para funcionar.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
