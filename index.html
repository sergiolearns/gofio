<style>
/* Lo primero que se pinta: fondo basalto (nada de pantalla gris) y una cortinilla quieta, idéntica a la imagen de arranque
   de iOS, que se funde cuando la app está lista. El disco girando se queda para la portada (G53). */
html,body{background:#1B1917;margin:0}
#cortinilla{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1B1917}
#cortinilla .c-logo{width:min(56vw,240px);height:auto}
#cortinilla .c-sub{margin:16px 0 0;color:#A89D8F;font:600 15px/1 "Hanken Grotesk",system-ui,-apple-system,sans-serif;letter-spacing:.04em}
</style>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="cortinilla" aria-hidden="true">
  <img class="c-logo" src="iconos/gofio-logo-oscuro.svg" alt="" width="240" height="98">
  <p class="c-sub">Hecho en Canarias</p>
</div>
<div id="app" aria-live="polite"></div>
<nav id="pestanas" class="pestanas" aria-label="Secciones" hidden></nav>
<div id="capa-hojas"></div>
<div id="aviso" class="aviso" role="status" hidden></div>
<noscript><p style="padding:24px">Gofio necesita JavaScript para funcionar.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
