<script>
// G60-G62 · Si la app sigue instalada con la barra translúcida (instalaciones de antes de la 0.1.7), iOS 26-27 la pinta
// desde arriba pero 59 px más corta: se mide lo que falta para no sumar dos veces el margen de abajo y centrar la
// cortinilla en la pantalla entera. Con la barra opaca (instalaciones nuevas) no falta nada.
(function () {
  var raiz = document.documentElement;
  function medir() {
    var falta = 0;
    if (navigator.standalone) {
      var sonda = document.createElement('div');
      sonda.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:100%;padding-top:env(safe-area-inset-top);box-sizing:content-box;visibility:hidden;pointer-events:none';
      raiz.appendChild(sonda);
      var r = sonda.getBoundingClientRect();
      var arriba = parseFloat(getComputedStyle(sonda).paddingTop) || 0;
      sonda.remove();
      var vertical = matchMedia('(orientation: portrait)').matches;
      var alto = vertical ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      var mide = r.height - arriba;
      var dif = alto - mide;
      if (dif < 0 || dif > 140) dif = 0;
      if (arriba > 0) falta = dif;                       // solo si la app se pinta bajo la barra de estado
      // La imagen de arranque ocupa la pantalla entera: la muela de la cortinilla se centra en la pantalla, no en la app
      // (más abajo si la app empieza arriba del todo; más arriba si empieza debajo de la barra opaca).
      raiz.style.setProperty('--centro', (arriba > 0 ? dif / 2 : -dif / 2) + 'px');
      // G88 · Con la barra opaca, la página empieza debajo de la barra de iOS (59 px en su iPhone): lo que se diseñó
      // midiendo desde arriba de la pantalla (el disco de Hoy) se coloca restando esta medida.
      raiz.style.setProperty('--barra', (arriba > 0 ? 0 : dif) + 'px');
      window.gofioPantalla = { alto: alto, app: Math.round(mide), arriba: arriba, barra: arriba > 0 ? 0 : dif };
    }
    raiz.style.setProperty('--falta', falta + 'px');
    // Solo para las pruebas en el ordenador: ?prueba-barra=59 hace como si hubiera encima la barra opaca del iPhone.
    var pb = /[?&]prueba-barra=(\d+)/.exec(location.search);
    if (pb) { raiz.style.setProperty('--barra', pb[1] + 'px'); window.gofioPantalla = { alto: innerHeight + +pb[1], app: innerHeight, arriba: 0, barra: +pb[1] }; }
  }
  raiz.style.backgroundColor = '#D4922B';                // mientras está la cortinilla
  medir();
  addEventListener('resize', medir);
  addEventListener('orientationchange', function () { setTimeout(medir, 300); });
  addEventListener('pageshow', medir);
  window.gofioMedir = medir;
})();
</script>
<script>
// G93 · Actualizar sin depender del aviso. La página (index.html) sale al momento de lo guardado y se renueva para la
// próxima vez (G99); el resto de la app también sale de lo guardado: si hay una versión nueva esperando y aún no has tocado nada, se aplica al abrir
// (la cortinilla tapa la recarga). Si llega más tarde, sale el aviso «Hay versión nueva» y decides tú.
(function () {
  if (!('serviceWorker' in navigator)) return;
  var tocado = false, recargado = false;
  addEventListener('pointerdown', function () { tocado = true; }, { once: true, capture: true });
  function aplicar(w) { if (w && !tocado && navigator.serviceWorker.controller) w.postMessage('saltar'); }
  navigator.serviceWorker.getRegistration().then(function (reg) {
    if (!reg) return;
    if (reg.waiting) aplicar(reg.waiting);
    reg.addEventListener('updatefound', function () {
      var w = reg.installing;
      if (w) w.addEventListener('statechange', function () { if (w.state === 'installed') aplicar(w); });
    });
    reg.update().catch(function () {});
  });
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (!recargado && !tocado) { recargado = true; location.reload(); } });
})();
</script>
